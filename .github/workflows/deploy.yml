name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/website-wireframes-userflow-demo-vc8swf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Rebuilds docs/ from src/ so the deployed site can never drift from
      # the committed sources.
      - name: Build site
        run: npm run build

      - name: Fail if the committed build is stale
        run: |
          if ! git diff --quiet -- docs; then
            echo "::error::docs/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- docs
            exit 1
          fi

      # Pages has to be switched on once by a repository admin; the Actions
      # token cannot create the site itself. Until then this step fails, so
      # let it, and skip the deploy rather than failing the whole run.
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Explain how to enable Pages
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages is not enabled for this repository, so the site was built but not deployed."
          echo "Enable it under Settings -> Pages -> Source: GitHub Actions, then re-run this workflow."
          echo "Or serve the committed output directly: Settings -> Pages -> Deploy from a branch -> this branch, /docs."

      - name: Upload site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
